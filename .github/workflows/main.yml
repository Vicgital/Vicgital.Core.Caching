name: Vicgital.Core.Caching


on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  GH_PACKAGE_USERNAME: ${{ secrets.GH_PACKAGE_USERNAME }}
  GH_PACKAGE_TOKEN: ${{ secrets.GH_PACKAGE_TOKEN }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    strategy:
      matrix:
        startupProject:
          - "src/Vicgital.Core.Caching/Vicgital.Core.Caching.csproj"
          - "src/Vicgital.Core.Caching.InMemory/Vicgital.Core.Caching.InMemory.csproj"
          - "src/Vicgital.Core.Caching.Redis/Vicgital.Core.Caching.Redis.csproj"
    steps:

      - name: Publish Nuget Package
        uses: vicgital/cicd/actions/dotnetNugetPublish@main
        with:
          startupProject: ${{ matrix.startupProject }}
          githubPublishPackageToken: ${{ secrets.GITHUB_TOKEN }}